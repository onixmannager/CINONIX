<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Películas</title>
</head>
<body>
    <!-- Menú -->
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="buscador.html">Buscar Películas</a></li> <!-- Enlace al buscador -->
        </ul>
    </nav>

    <!-- Buscador de Películas -->
    <input type="text" id="searchInput" list="movieSuggestions" placeholder="Buscar película..." onkeydown="searchMovie(event)">
    <datalist id="movieSuggestions"></datalist>

    <script>
        // Lista de películas con sus URLs
        const movies = {
            "matrix": "https://tusitio.com/matrix",
            "avatar": "https://tusitio.com/avatar",
            "titanic": "https://tusitio.com/titanic",
            "interestelar": "https://tusitio.com/interestelar"
        };

        // Llenar el datalist con las películas
        const datalist = document.getElementById("movieSuggestions");
        Object.keys(movies).forEach(title => {
            let option = document.createElement("option");
            option.value = title;
            datalist.appendChild(option);
        });

        function searchMovie(event) {
            if (event.key === "Enter") { // Detectar cuando presionan "Enter"
                let query = document.getElementById("searchInput").value.toLowerCase().trim();
                
                // Buscar coincidencia parcial (que el texto esté incluido en el título)
                let foundMovie = Object.keys(movies).find(title => title.includes(query));

                if (foundMovie) {
                    window.location.href = movies[foundMovie]; // Redirige a la película encontrada
                } else {
                    alert("Película no encontrada");
                }
            }
        }
    </script>
</body>
</html>
