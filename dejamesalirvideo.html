  <script>
    function reloadIframeIfError() {
      const iframe = document.getElementById("miVideo");
      const startTime = Date.now();
      let reloaded = false;
      
      const checkLoad = setInterval(() => {
        if (Date.now() - startTime > 10000 && !reloaded) {
          console.log("El video no cargó, intentando recargar...");
          iframe.src = iframe.src.split("?")[0] + "?nocache=" + new Date().getTime();
          reloaded = true;
          clearInterval(checkLoad);
        }
      }, 2000);
    }
    window.onload = reloadIframeIfError;
  </script>  <script>
    function requestFullscreen() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen();

        docEl.webkitRequestFullscreen();
      } else if (docEl.msRequestFullscreen) {
        docEl.msRequestFullscreen();
      }
    }
