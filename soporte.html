<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Cinonix · Soporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS — CINONIX
═══════════════════════════════════════════ */
:root {
  --ink:      #080808;
  --ink2:     #0c0c0c;
  --ink3:     #101010;
  --surface:  #141414;
  --surface2: #1a1a1a;
  --surface3: #202020;
  --red:      #e84522;
  --red-lt:   #ff7155;
  --red-dk:   #b52d0f;
  --red-dim:  rgba(232,69,34,.10);
  --cream:    #fff0eb;
  --text:     #ede8e5;
  --muted:    #6b6560;
  --muted2:   #a09890;
  --line:     rgba(255,255,255,.06);
  --line-r:   rgba(232,69,34,.20);
  --ok:       #22c55e;
  --shadow:   0 40px 100px rgba(0,0,0,.85), 0 8px 24px rgba(0,0,0,.5);
  --ff-d:'Bebas Neue', 'Arial Narrow', sans-serif;
  --ff-b:'Outfit', system-ui, sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-s:cubic-bezier(.34,1.56,.64,1);
}

/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{
  font-family:var(--ff-b);
  background:var(--ink);
  color:var(--text);
  height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  overflow:hidden;
}
::selection{background:rgba(232,69,34,.28);color:#fff;}

/* ═══════════════════════════════════════════
   AMBIENT LAYERS
═══════════════════════════════════════════ */
.bg-canvas{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.orb{
  position:absolute;border-radius:50%;filter:blur(110px);
  animation:orbDrift 16s ease-in-out infinite alternate;
}
.orb-1{
  width:520px;height:520px;top:-180px;left:-150px;
  background:radial-gradient(circle,rgba(232,69,34,.12) 0%,transparent 70%);
  animation-delay:0s;
}
.orb-2{
  width:380px;height:380px;bottom:-120px;right:-100px;
  background:radial-gradient(circle,rgba(180,20,10,.08) 0%,transparent 70%);
  animation-delay:-6s;
}
.orb-3{
  width:280px;height:280px;top:45%;right:5%;
  background:radial-gradient(circle,rgba(232,100,34,.06) 0%,transparent 70%);
  animation-delay:-11s;
}
@keyframes orbDrift{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(28px,18px) scale(1.10);}
}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(232,69,34,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,69,34,.018) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,black 0%,transparent 100%);
}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.par{
  position:absolute;border-radius:50%;
  background:var(--red);
  animation:parFloat linear infinite;
  opacity:0;
}
@keyframes parFloat{
  0%{opacity:0;transform:translateY(0) scale(0);}
  10%{opacity:.4;}
  90%{opacity:.1;}
  100%{opacity:0;transform:translateY(-120px) scale(1.4);}
}

/* ═══════════════════════════════════════════
   SHELL
═══════════════════════════════════════════ */
.shell{
  position:relative;z-index:2;
  width:100%;max-width:880px;
  height:100%;max-height:840px;
  display:flex;flex-direction:column;
  border-radius:28px;
  border:1px solid var(--line-r);
  background:rgba(8,8,8,.95);
  backdrop-filter:blur(28px) saturate(1.4);
  box-shadow:var(--shadow);
  overflow:hidden;
  animation:shellIn .65s var(--ease) both;
}
@keyframes shellIn{
  from{opacity:0;transform:translateY(30px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.shell::after{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;z-index:10;
  background:linear-gradient(90deg,
    transparent 0%,
    var(--red-dk) 20%,
    var(--red) 40%,
    var(--red-lt) 50%,
    var(--red) 60%,
    var(--red-dk) 80%,
    transparent 100%
  );
  background-size:200% 100%;
  animation:topLine 3s linear infinite;
}
@keyframes topLine{
  from{background-position:200% 0;}
  to{background-position:-200% 0;}
}
.shell::before{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:.016;border-radius:inherit;
}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.hdr{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:18px 22px;
  background:linear-gradient(180deg,rgba(14,8,6,.97) 0%,rgba(8,8,8,.88) 100%);
  border-bottom:1px solid var(--line-r);
  flex-shrink:0;position:relative;z-index:5;
  animation:slideDown .5s var(--ease) .1s both;
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-14px);}
  to{opacity:1;transform:translateY(0);}
}
.hdr-left{display:flex;align-items:center;gap:14px;min-width:0;}

.logo-wrap{position:relative;flex-shrink:0;}
.logo{
  width:52px;height:52px;border-radius:16px;
  background:linear-gradient(135deg,var(--red-lt) 0%,var(--red) 55%,var(--red-dk) 100%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1.45rem;font-weight:900;
  position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(232,69,34,.45), 0 8px 30px rgba(232,69,34,.28);
  animation:logoGlow 3.5s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{box-shadow:0 0 0 1px rgba(232,69,34,.4),0 8px 30px rgba(232,69,34,.22);}
  50%{box-shadow:0 0 0 2px rgba(232,69,34,.65),0 8px 44px rgba(232,69,34,.45);}
}
.logo-sweep{
  position:absolute;top:0;left:-80%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.30) 50%,transparent 65%);
  animation:logoSweep 3.8s ease-in-out infinite;
}
@keyframes logoSweep{0%,65%,100%{left:-80%;}32%{left:130%;}}
.logo-symbol{position:relative;z-index:1;font-size:1.5rem;}

.presence{
  position:absolute;bottom:-3px;right:-3px;
  width:14px;height:14px;border-radius:50%;
  background:var(--ok);border:2.5px solid var(--ink);
  animation:presIn .5s var(--ease-s) .6s both, presGlow 2.6s ease-in-out infinite 1s;
}
@keyframes presIn{from{transform:scale(0);}to{transform:scale(1);}}
@keyframes presGlow{
  0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.18);}
  50%{box-shadow:0 0 0 8px rgba(34,197,94,.05);}
}

.brand{min-width:0;}
.brand-name{
  font-family:var(--ff-d);
  font-size:1.55rem;font-weight:400;
  letter-spacing:.08em;color:#fff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1;
}
.brand-sub{font-size:.77rem;color:var(--muted2);margin-top:4px;font-weight:400;}
.pills{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 11px;border-radius:99px;font-size:.71rem;white-space:nowrap;
  border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);
  color:var(--muted2);
  animation:pillIn .4s var(--ease-s) both;
}
.pill:nth-child(1){animation-delay:.3s;}
.pill:nth-child(2){animation-delay:.4s;}
.pill:nth-child(3){animation-delay:.5s;}
@keyframes pillIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.pill-live{border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.05);color:#4ade80;}
.pill-red{border-color:var(--line-r);background:var(--red-dim);color:var(--red-lt);}
.pdot{width:6px;height:6px;border-radius:50%;}
.pill-live .pdot{background:var(--ok);animation:presGlow 2s infinite;}
.pill-red .pdot{background:var(--red);animation:logoGlow 2s infinite;}

.hdr-right{display:flex;gap:8px;flex-shrink:0;}
.hbtn{
  border:1px solid var(--line);border-radius:12px;
  padding:9px 14px;background:rgba(255,255,255,.04);
  color:var(--muted2);cursor:pointer;
  transition:all .22s var(--ease);
  font-family:var(--ff-b);font-size:.82rem;font-weight:500;
  display:flex;align-items:center;gap:7px;
}
.hbtn:hover{
  background:var(--red-dim);border-color:var(--line-r);
  color:var(--red-lt);transform:translateY(-2px);
  box-shadow:0 4px 18px rgba(232,69,34,.14);
}
.hbtn svg{transition:transform .4s var(--ease);}
.hbtn:hover svg{transform:rotate(-180deg);}

/* ═══════════════════════════════════════════
   MESSAGES
═══════════════════════════════════════════ */
.msgs{
  flex:1;overflow-y:auto;
  padding:22px 20px 14px;
  display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;position:relative;
}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-track{background:transparent;}
.msgs::-webkit-scrollbar-thumb{background:rgba(232,69,34,.22);border-radius:99px;}

.date-row{
  display:flex;align-items:center;gap:12px;margin:4px 0;
  animation:fadeIn .4s var(--ease);
}
.date-row::before,.date-row::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-r),transparent);
}
.date-row span{
  font-size:.68rem;color:var(--muted);
  letter-spacing:.09em;text-transform:uppercase;font-weight:500;white-space:nowrap;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.msg{
  display:flex;flex-direction:column;gap:5px;
  max-width:80%;
}
.msg.bot{align-self:flex-start;animation:msgBot .35s var(--ease-s) both;}
.msg.user{align-self:flex-end;animation:msgUser .3s var(--ease-s) both;}
@keyframes msgBot{
  from{opacity:0;transform:translateX(-18px) translateY(8px);}
  to{opacity:1;transform:translateX(0) translateY(0);}
}
@keyframes msgUser{
  from{opacity:0;transform:translateX(18px) translateY(8px);}
  to{opacity:1;transform:translateX(0) translateY(0);}
}

.mwho{font-size:.67rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 5px;}
.msg.user .mwho{text-align:right;color:var(--red-dk);}

.bubble{
  border-radius:20px;padding:15px 18px;
  border:1px solid var(--line);position:relative;overflow:hidden;
}
.msg.bot .bubble{
  background:linear-gradient(155deg,var(--surface) 0%,var(--ink3) 100%);
  border-color:rgba(255,255,255,.07);
  border-bottom-left-radius:5px;
}
.msg.bot .bubble::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(140deg,rgba(232,69,34,.06) 0%,transparent 50%);
}
.msg.bot .bubble::after{
  content:'';position:absolute;top:0;left:-100%;
  width:55%;height:100%;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.04) 50%,transparent 70%);
  animation:bShimmer .55s var(--ease) both;
}
@keyframes bShimmer{from{left:-100%;}to{left:160%;}}

.msg.user .bubble{
  background:linear-gradient(145deg,var(--red-lt) 0%,var(--red) 50%,var(--red-dk) 100%);
  color:#fff;border-color:rgba(255,255,255,.15);
  border-bottom-right-radius:5px;
  box-shadow:0 6px 28px rgba(232,69,34,.28);
}

.mtitle{
  font-family:var(--ff-d);font-size:1.05rem;font-weight:400;
  letter-spacing:.06em;
  color:var(--red-lt);margin-bottom:9px;
  display:flex;align-items:center;gap:7px;
  position:relative;z-index:1;
}
.msg.user .mtitle{color:#fff;}

.mtext{
  font-size:.93rem;line-height:1.67;
  color:var(--text);position:relative;z-index:1;
}
.mtext b{color:var(--red-lt);font-weight:600;}
.msg.user .mtext{color:#fff;font-weight:400;}
.msg.user .mtext b{color:#ffddd5;}

.chips{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;
  position:relative;z-index:1;
}
.chip{
  border:1px solid rgba(232,69,34,.22);border-radius:99px;
  padding:7px 14px;background:rgba(232,69,34,.07);
  color:var(--red-lt);font-size:.77rem;font-weight:600;
  cursor:pointer;transition:all .22s var(--ease);
  font-family:var(--ff-b);position:relative;overflow:hidden;
}
.chip::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(105deg,transparent 30%,rgba(232,69,34,.14) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .4s var(--ease);
}
.chip:hover::after{transform:translateX(100%);}
.chip:hover{
  background:rgba(232,69,34,.18);border-color:rgba(232,69,34,.5);
  color:#fff;transform:translateY(-2px);
  box-shadow:0 4px 20px rgba(232,69,34,.18);
}
.chip:nth-child(1){animation:chipIn .28s var(--ease-s) .06s both;}
.chip:nth-child(2){animation:chipIn .28s var(--ease-s) .12s both;}
.chip:nth-child(3){animation:chipIn .28s var(--ease-s) .18s both;}
.chip:nth-child(4){animation:chipIn .28s var(--ease-s) .24s both;}
.chip:nth-child(5){animation:chipIn .28s var(--ease-s) .30s both;}
.chip:nth-child(6){animation:chipIn .28s var(--ease-s) .36s both;}
@keyframes chipIn{
  from{opacity:0;transform:translateY(10px) scale(.88);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

.mts{font-size:.66rem;color:var(--muted);padding:0 5px;}
.msg.user .mts{text-align:right;}

/* TYPING BUBBLE */
.typing-bbl{
  display:flex;align-items:center;gap:7px;
  padding:16px 20px !important;min-width:76px;
}
.tdot{
  width:8px;height:8px;border-radius:50%;
  background:var(--red);opacity:.3;
  animation:tdot 1.4s infinite ease-in-out;
}
.tdot:nth-child(2){animation-delay:.18s;}
.tdot:nth-child(3){animation-delay:.36s;}
@keyframes tdot{
  0%,80%,100%{transform:scale(.65);opacity:.22;}
  40%{transform:scale(1.1);opacity:.95;}
}

/* SCROLL FAB */
.sfab{
  position:absolute;bottom:16px;right:18px;z-index:20;
  border:1px solid var(--line-r);border-radius:99px;
  padding:8px 16px;background:rgba(232,69,34,.11);
  color:var(--red-lt);cursor:pointer;font-size:.74rem;font-weight:600;
  display:flex;align-items:center;gap:6px;font-family:var(--ff-b);
  backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35);
  transition:all .22s var(--ease);
  opacity:0;pointer-events:none;transform:translateY(8px);
}
.sfab.show{opacity:1;pointer-events:all;transform:translateY(0);}
.sfab:hover{background:rgba(232,69,34,.22);transform:translateY(-2px);}

/* ═══════════════════════════════════════════
   COMPOSER
═══════════════════════════════════════════ */
.composer{
  padding:14px 18px 18px;
  border-top:1px solid rgba(255,255,255,.05);
  background:linear-gradient(0deg,rgba(4,4,4,1) 0%,rgba(8,8,8,.85) 100%);
  flex-shrink:0;position:relative;z-index:5;
  animation:slideUp .5s var(--ease) .15s both;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}

.cmp-wrap{
  display:flex;gap:10px;align-items:flex-end;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:10px 10px 10px 18px;
  transition:all .28s var(--ease);
  position:relative;
}
.cmp-wrap:focus-within{
  background:rgba(232,69,34,.04);
  border-color:rgba(232,69,34,.22);
}

.cmp-wrap textarea{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--ff-b);font-size:.93rem;font-weight:400;
  resize:none;line-height:1.56;max-height:130px;min-height:22px;
  padding:4px 0;scrollbar-width:thin;
}
.cmp-wrap textarea::placeholder{color:#3a3530;}

.send{
  flex-shrink:0;border:none;border-radius:14px;
  width:46px;height:46px;
  background:linear-gradient(145deg,var(--red-lt) 0%,var(--red) 55%,var(--red-dk) 100%);
  color:#fff;cursor:pointer;
  transition:all .25s var(--ease-s);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  box-shadow:0 4px 18px rgba(232,69,34,.32);
  position:relative;overflow:hidden;
}
.send::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(140deg,rgba(255,255,255,.22) 0%,transparent 60%);
}
.send svg{position:relative;z-index:1;transition:transform .22s var(--ease-s);}
.send:hover:not(:disabled) svg{transform:translateX(2px) translateY(-1px);}
.send:hover:not(:disabled){
  transform:translateY(-3px) scale(1.06);
  box-shadow:0 10px 32px rgba(232,69,34,.46);
}
.send:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none;}

.cmp-foot{
  margin-top:10px;padding:0 5px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.foot-l{font-size:.71rem;color:var(--muted);display:flex;align-items:center;gap:6px;}
.foot-l kbd{
  font-size:.64rem;padding:1px 6px;border-radius:5px;
  border:1px solid var(--line);color:var(--muted);font-family:var(--ff-b);
}
.foot-r{display:flex;align-items:center;gap:12px;}
.chars{font-size:.7rem;color:var(--muted);transition:.2s;}
.chars.warn{color:var(--red-dk);}

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media(max-width:640px){
  body{padding:0;}
  .shell{max-width:none;border-radius:0;max-height:none;border-left:none;border-right:none;border-bottom:none;}
  .hdr{padding:14px 16px;}
  .pills{display:none;}
  .brand-name{font-size:1.35rem;}
  .msgs{padding:16px 14px 10px;}
  .msg{max-width:88%;}
  .bubble{padding:12px 15px;}
  .mtext{font-size:.88rem;}
  .composer{padding:12px 14px 16px;}
  .chip{padding:6px 12px;font-size:.74rem;}
}
@media(max-width:380px){
  .msg{max-width:94%;}
  .brand-sub{display:none;}
}
</style>
</head>
<body>

<!-- AMBIENT -->
<div class="bg-canvas">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="bg-grid"></div>
<div class="particles" id="particles"></div>

<!-- SHELL -->
<div class="shell">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-left">

/* ─── RESPUESTA POR DEFECTO ───────────────────────── */
const DEFAULT_RESPONSE = {
  answer: "Gracias por tu mensaje. En este momento no tengo información específica sobre esa consulta.\n\nPara darte la respuesta más precisa, te recomendamos contactar directamente con nuestro equipo:\n\n📧 **" + CONTACT_EMAIL + "**\n\nEstarán encantados de ayudarte con cualquier pregunta.",
  chips: ["🎬 ¿Qué es Cinonix?","💰 ¿Cuánto cuesta?","🤝 Programa de afiliados","📩 Contactar con soporte"]
};

/* ─── UTILS ───────────────────────────────────────── */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now   = () => new Date().toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"});

function normalize(s) {
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\w\s]/g, " ")
    .trim();
}

/* ─── MOTOR DE BÚSQUEDA ────────── */
function findResponse(userText) {
  const norm = normalize(userText);
  let bestMatch = null;
  let bestScore = 0;

  for (const entry of KB) {
    let score = 0;
    for (const kw of entry.keywords) {
      const normKw = normalize(kw);
      if (norm.includes(normKw)) {
        score += normKw.split(" ").length;
      }
    }
    if (score > bestScore) {
      bestScore = score;
      bestMatch = entry;
    }
  }

  return bestScore > 0 ? bestMatch : DEFAULT_RESPONSE;
}

/* ─── ESTADO ──────────────────────────────────────── */
let busy = false;

/* ─── ELEMENTOS ───────────────────────────────────── */
const msgsEl   = document.getElementById("msgs");
const inp      = document.getElementById("inp");
const sendBtn  = document.getElementById("sendBtn");
const sfab     = document.getElementById("sfab");
const charsEl  = document.getElementById("chars");

/* ─── PARTÍCULAS ──────────────────────────────────── */
(function spawnParticles() {
  const c = document.getElementById("particles");
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("div");
    p.className = "par";
    const size = Math.random() * 3 + 1;
    p.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random() * 100}%;
      bottom:${Math.random() * 30}%;
      opacity:0;
      animation-duration:${6 + Math.random() * 10}s;
      animation-delay:${Math.random() * 8}s;
    `;
    c.appendChild(p);
  }
})();

/* ─── SCROLL ──────────────────────────────────────── */
function scrollDown(smooth = true) {
  msgsEl.scrollTo({top: msgsEl.scrollHeight, behavior: smooth ? "smooth" : "instant"});
}
msgsEl.addEventListener("scroll", () => {
  const atBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 100;
  sfab.classList.toggle("show", !atBottom);
});
sfab.addEventListener("click", () => scrollDown());

/* ─── TEXTAREA ────────────────────────────────────── */
inp.addEventListener("input", () => {
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 130) + "px";
  const l = inp.value.length;
  sendBtn.disabled = !inp.value.trim() || busy;
  charsEl.textContent = `${l}/1000`;
  charsEl.classList.toggle("warn", l > 850);
});
inp.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {e.preventDefault(); if (!sendBtn.disabled) doSend();}
});
sendBtn.addEventListener("click", doSend);

/* ─── DIVISOR DE FECHA ────────────────────────────── */
function addDateDivider() {
  const d = document.createElement("div");
  d.className = "date-row";
  const label = new Date().toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"});
  d.innerHTML = `<span>${label[0].toUpperCase() + label.slice(1)}</span>`;
  msgsEl.insertBefore(d, sfab);
}

/* ─── AÑADIR MENSAJE ──────────────────────────────── */
function addMsg({sender, title="", text="", chips=[], isTyping=false}) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${sender}`;
  if (isTyping) wrap.id = "typing";

  const who = document.createElement("div");
  who.className = "mwho";
  who.textContent = sender === "bot" ? "Asistente Cinonix" : "Tú";

  const bbl = document.createElement("div");
  bbl.className = "bubble";

  if (isTyping) {
    bbl.classList.add("typing-bbl");
    bbl.innerHTML = "<span class='tdot'></span><span class='tdot'></span><span class='tdot'></span>";
  } else {
    if (title) {
      const t = document.createElement("div");
      t.className = "mtitle"; t.textContent = title; bbl.appendChild(t);
    }
    const p = document.createElement("div");
    p.className = "mtext";
    p.innerHTML = text
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\n/g, "<br>");
    bbl.appendChild(p);

    if (chips.length) {
      const cw = document.createElement("div");
      cw.className = "chips";
      chips.forEach(c => {
        const label = typeof c === "string" ? c : (c.label || c);
        const btn = document.createElement("button");
        btn.className = "chip"; btn.textContent = label;
        btn.addEventListener("click", () => {
          if (label.includes("Reiniciar")) { resetChat(); return; }
          inp.value = label;
          inp.style.height = "auto";
          sendBtn.disabled = false;
          doSend();
        });
        cw.appendChild(btn);
      });
      bbl.appendChild(cw);
    }
  }

  const ts = document.createElement("div");
  ts.className = "mts";
  ts.textContent = sender === "bot" ? `Asistente · ${now()}` : `Tú · ${now()}`;

  wrap.appendChild(who); wrap.appendChild(bbl); wrap.appendChild(ts);
  msgsEl.insertBefore(wrap, sfab);
  scrollDown();
  return wrap;
}

/* ─── TYPING ──────────────────────────────────────── */
function showTyping() {removeTyping(); addMsg({sender:"bot", isTyping:true});}
function removeTyping() {const e = document.getElementById("typing"); if (e) e.remove();}

/* ─── ENVÍO PRINCIPAL ─────────────────────────────── */
async function doSend() {
  const text = inp.value.trim();
  if (!text || busy) return;

  addMsg({sender:"user", text});
  inp.value = ""; inp.style.height = "auto";
  sendBtn.disabled = true; charsEl.textContent = "0/1000";

  busy = true;
  showTyping();

  await sleep(500 + Math.random() * 400);

  removeTyping();

  const result = findResponse(text);
  addMsg({
    sender:"bot",
    text: result.answer,
    chips: result.chips || []
  });

  busy = false;
  sendBtn.disabled = !inp.value.trim();
}

/* ─── REINICIAR ───────────────────────────────────── */
function resetChat() {
  [...msgsEl.children].forEach(c => {if (c.id !== "sfab") c.remove();});
  init();
}

/* ─── INICIO ──────────────────────────────────────── */
async function init() {
  addDateDivider();
  await sleep(280);
  showTyping();
  await sleep(700);
  removeTyping();

  addMsg({
    sender:"bot",
    title:"🎬 Bienvenido a Cinonix",
    text:"Hola, soy tu asistente de soporte y puedo responder cualquier pregunta sobre la plataforma.\n\nDesde qué plataformas incluye hasta precios, cómo funciona o cómo empezar a disfrutar de todo tu entretenimiento en un solo lugar. ¿Qué quieres saber?",
    chips:["🎬 ¿Qué es Cinonix?","📺 ¿Qué plataformas incluye?","💰 ¿Cuánto cuesta?","🤝 Programa de afiliados"]
  });

  inp.focus();
}

window.addEventListener("DOMContentLoaded", init);
</script>
