<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Afiliados</title>
    <style>
        .dashboard-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        .referrals-list {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Panel de Afiliados</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Tu Código</h3>
                <div id="affiliate-code" class="stat-value">Cargando...</div>
            </div>
            <div class="stat-card">
                <h3>Ganancias Totales</h3>
                <div id="balance" class="stat-value">€0.00</div>
            </div>
        </div>

        <div class="referrals-list">
            <h2>Tus Referidos</h2>
            <ul id="referrals-list">
                <li>Cargando referidos...</li>
            </ul>
        </div>

        <button onclick="location.href='cinonix.html'">Volver a la Plataforma</button>
    </div>

    <script type="module">
        import { app, auth, db, restringirContenido, cargarDashboard } from "./app.js";
        
        // Verificar autenticación y suscripción
        restringirContenido();
        
        // Cargar datos del dashboard
        document.addEventListener('DOMContentLoaded', cargarDashboard);
    </script>
</body>
</html>
