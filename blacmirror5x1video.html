<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Configuración del viewport (incluye viewport-fit=cover para dispositivos con notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Habilitar modo web app en iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Habilitar modo web app en Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Incrustar el manifest vía data URI (sin archivo adicional) -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22display%22%3A%22fullscreen%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
  <!-- Color del tema -->
  <meta name="theme-color" content="#000000">

    <!-- Metadatos Open Graph -->
  <meta property="og:title" content="Cinonix - Cine - Aladin">
  <meta property="og:description" content=" Aladin">
  <meta property="og:image" content="https://raw.githubusercontent.com/onixmannager/Pruebas/refs/heads/main/logoappcinonix.jpg">
  <meta property="og:type" content="website">

  <!-- Configuración básica -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cinonix">
  <meta name="theme-color" content="#999999">

  <!-- Iconos -->
  <link rel="icon" href="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  
  
  <title>Black Mirror - Serie De Cinonix</title>
  
  <style>
    /* Estilos generales */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }

    /* Contenedor del iframe */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Estilos del iframe */
    iframe {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border: none;
    }

    /* Ajustes para dispositivos móviles en orientación vertical (reloj 16:9) */
    @media (orientation: portrait) {
      iframe {
        width: 100%;
        height: 56.25vw;
      }
    }

    /* Ajustes para dispositivos móviles en orientación horizontal (reloj 16:9) */
    @media (orientation: landscape) {
      iframe {
        width: 177.78vh;
        height: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="video-container">
       <iframe id="miVideo" src="https://archive.org/embed/5x-01_202504" width="640" height="480" frameborder="0" webkitallowfullscreen="true" mozallowfullscreen="true" allowfullscreen></iframe>
  </div>
  <div id="avisoArchiveOrg" style="
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 9999; max-width: 92%; width: 380px;
      background: rgba(15,15,15,0.94); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px; padding: 14px 16px;
      font-family: system-ui, -apple-system, sans-serif; color: #fff;
      box-shadow: 0 6px 22px rgba(0,0,0,0.45); backdrop-filter: blur(8px);
    ">
    <p style="margin: 0 0 12px; font-size: 13.5px; line-height: 1.4; color: rgba(255,255,255,0.88);">
      Este video usa un proveedor externo que a veces tarda o falla al iniciar.
      Si no se ve en unos 20 segundos, pulsa <strong>Reintentar</strong>.
    </p>
    <div style="display: flex; gap: 10px;">
      <button type="button" id="btnPeliculaLista" style="
          flex: 1; padding: 10px 14px; border-radius: 10px; border: none;
          background: #fff; color: #000; font-size: 14px; font-weight: 600;
          cursor: pointer; font-family: inherit;
        ">Película lista</button>
      <button type="button" id="btnReintentarArchive" style="
          flex: 1; padding: 10px 14px; border-radius: 10px;
          border: 1px solid rgba(255,255,255,0.35); background: transparent;
          color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
          font-family: inherit; display: none;
        ">Reintentar</button>
    </div>
  </div>

  <script>
    // Aviso manual para iframes de archive.org: sin recargas automáticas.
    // El usuario decide siempre: "Película lista" cierra el aviso,
    // "Reintentar" (visible a partir de ~20s) recarga el iframe si hace falta.
    (function () {
      var iframe = document.getElementById('miVideo');
      var aviso = document.getElementById('avisoArchiveOrg');
      var btnLista = document.getElementById('btnPeliculaLista');
      var btnReintentar = document.getElementById('btnReintentarArchive');
      if (!iframe || !aviso || !btnLista || !btnReintentar) return;

      var ESPERA_BOTON_REINTENTAR_MS = 20000;

      var timerMostrarReintentar = setTimeout(function () {
        btnReintentar.style.display = 'block';
      }, ESPERA_BOTON_REINTENTAR_MS);

      btnLista.addEventListener('click', function () {
        clearTimeout(timerMostrarReintentar);
        aviso.style.display = 'none';
      });

      btnReintentar.addEventListener('click', function () {
        var base = iframe.src.split('?')[0];
        var sep = base.indexOf('?') === -1 ? '?' : '&';
        iframe.src = base + sep + '_r=' + Date.now();
      });
    })();
  </script>


    
  <script>
    // Función para solicitar pantalla completa utilizando la Fullscreen API
    function requestFullscreen() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen();
      } else if (docEl.webkitRequestFullscreen) { // Safari, Chrome y otros navegadores basados en Webkit
        docEl.webkitRequestFullscreen();
      } else if (docEl.msRequestFullscreen) { // IE/Edge
        docEl.msRequestFullscreen();
      }
    }

    // Al detectar la primera interacción (tocado o clic) se solicita pantalla completa.
    // Nota: Muchos navegadores requieren que esta acción sea el resultado de una interacción directa.
    document.addEventListener('touchstart', function() {
      requestFullscreen();
    }, { once: true });

    document.addEventListener('click', function() {
      requestFullscreen();
    }, { once: true });
  </script>

  <script type="module" src="app.js"></script>

  <script type="module">
    document.addEventListener('DOMContentLoaded', function() {
      window.restringirContenido(); // Llamamos a la función para verificar el acceso
    });
  </script>
</body>
</html>
