<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Metadatos Open Graph -->
  <meta property="og:title" content="Cinonix - En Construcción">
  <meta property="og:description" content="Estamos trabajando en ello. Próximamente, nuestro programa de afiliados estará disponible.">
  <meta property="og:image" content="https://i.imgur.com/Zj3Hq9h.png">
  <meta property="og:type" content="website">
  
  <!-- Configuración para móviles -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  
  <!-- Iconos -->
  <link rel="icon" href="https://i.imgur.com/Zj3Hq9h.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/Zj3Hq9h.png">
  
  <title>Cinonix - En Construcción</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    /* Reset y estilos globales */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #141414;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Header */
    .header {
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: bold;
      color: red;
      text-transform: uppercase;
      text-decoration: none;
    }
    /* Menú desplegable para volver atrás */
    .menu-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }
    .menu-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      color: white;
      font-size: 1rem;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    /* Contenido principal */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .main-content h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    .main-content p {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    /* Footer */
    .footer {
      padding: 20px;
      background-color: #000;
      text-align: center;
      color: #757575;
    }
    .footer a {
      color: inherit;
      text-decoration: none;
    }
    /* Responsividad */
    @media (max-width: 768px) {
      .main-content h1 {
        font-size: 1.5rem;
      }
      .main-content p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo">Cinonix</a>
    
    <!-- Botón para volver atrás -->
    <div class="menu-container">
      <a href="javascript:history.back()" class="menu-btn" aria-label="Volver atrás">
        <i class="fas fa-arrow-left"></i>
      </a>
    </div>
  </header>

  <!-- Contenido principal -->
  <div class="main-content">
    <div>
      <h1>¡Estamos trabajando en ello!</h1>
      <p>Mantente atento a nuestras actualizaciones.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    © 2025 Cinonix - Todos los derechos reservados
  </footer>
</body>
</html>
