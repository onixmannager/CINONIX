<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Metadatos Open Graph -->
  <meta property="og:title" content="Cinonix - Peliculas y Series Online -">
  <meta property="og:description" content="Disfruta del buen cine">
  <meta property="og:image" content="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  <meta property="og:type" content="website">
  <!-- Iconos -->
  <link rel="icon" href="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  <title>Cinonix - Cine - Series - Documentales</title>
  <!-- Preconexiones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <!-- Estilos -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    *{transition:all .3s ease;margin:0;padding:0;box-sizing:border-box}
    body{display:none;font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff;overflow-x:hidden}
    .menu-container{position:fixed;top:20px;right:20px;z-index:1000}
    .menu-btn{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.1);border-radius:10px;width:40px;height:40px;cursor:pointer;color:#fff;font-size:1.2rem;backdrop-filter:blur(5px)}
    .menu-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.1)}
    .dropdown-menu{position:absolute;top:50px;right:0;background:rgba(40,40,40,.95);border-radius:10px;padding:10px 0;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.3);backdrop-filter:blur(10px);display:none;opacity:0;transform:translateY(-10px)}
    .dropdown-menu.show{display:block;opacity:1;transform:translateY(0)}
    .dropdown-menu a{color:#fff;text-decoration:none;padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:.9rem}
    .dropdown-menu a:hover{background:rgba(255,255,255,.05);transform:translateX(5px)}
    .content-section{margin:3rem 0}
    .section-title{font-size:1.5rem;margin-bottom:.5rem;padding-left:1%;color:#fff;text-transform:uppercase;letter-spacing:2px}
    .movies-container{position:relative;overflow:hidden}
    .carousel-content{display:flex;gap:10px;padding:20px 0;scroll-behavior:smooth;overflow-x:auto}
    .carousel-content::-webkit-scrollbar{display:none}
    .movie-card{flex:0 0 170px;height:270px;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;text-decoration:none;color:inherit;transition:transform .4s}
    .movie-card:hover{transform:scale(1.05);z-index:2}
    .movie-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.9) 100%)}
    .movie-poster{width:100%;height:100%;object-fit:cover}
    .movie-title{position:absolute;bottom:15px;left:15px;z-index:3;font-size:1.1rem;font-weight:600;text-shadow:2px 2px 4px rgba(0,0,0,.5)}
    .carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;z-index:10}
    .carousel-arrow.left{left:20px}.carousel-arrow.right{right:20px}
    .carousel-arrow:hover{background:rgba(0,0,0,.8)}
    .carousel-dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
    .dot{width:15px;height:15px;background:rgba(255,255,255,.5);border-radius:50%;cursor:pointer;transition:background .3s ease}
    .dot.active{background:#fff}
    .carousel-content.infinite-scroll{animation:scroll 40s linear infinite;width:200%}
    @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .header-video{max-width:100%;max-height:500px;object-fit:cover;display:block;margin:0 auto}
    body:before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:20px 20px;z-index:-1;opacity:.3}
    @media (max-width:768px){
      .menu-btn{width:35px;height:35px;font-size:1rem}
      .dropdown-menu{top:45px;min-width:180px;padding:8px 0}
      .dropdown-menu a{padding:10px 15px;font-size:.85rem}
      .content-section{margin:0}
      .section-title{font-size:1.2rem;margin-bottom:0}
      .movie-card{flex:0 0 135px;height:175px}
      .movie-title{font-size:.95rem;bottom:10px;left:10px}
      .carousel-arrow,.carousel-dots{display:none}
    }
    @media (max-width:480px){
      .section-title{font-size:1.1rem}
      .dropdown-menu{min-width:160px}
      .content-section{margin-top:.5rem}
    }
  </style>
</head>
<body>
  <header>
    <video class="header-video" autoplay loop muted playsinline>
      <source src="videoCinoniX.mp4" type="video/mp4">
      Tu navegador no soporta videos.
    </video>
  </header>

  <div class="menu-container">
    <button class="menu-btn" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>
    <nav class="dropdown-menu">
      <a href="index.html"><i class="fas fa-home"></i>Inicio</a>  
      <a href="#cartelera"><i class="fas fa-volume-up"></i> Cartelera</a>
      <a href="#series"><i class="fas fa-tv"></i> Series</a>
      <a href="#accion"><i class="fas fa-fist-raised"></i> Acción</a>
      <a href="#comedia"><i class="fas fa-theater-masks"></i> Comedia</a>
      <a href="#drama"><i class="fas fa-mask"></i> Drama</a>
      <a href="#thriller"><i class="fas fa-user-secret"></i> Thriller</a>
      <a href="#terror"><i class="fas fa-ghost"></i> Terror</a>
      <a href="#infantiles"><i class="fas fa-baby"></i> Infantiles</a>
      <a href="dashboard.html"><i class="fas fa-dollar-sign"></i>Afiliado</a>
      <a href="javascript:void(0);" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
      <a href="https://github.com/onixmannager/Pruebas/raw/main/Cinonix.apk" target="_blank"><i class="fas fa-download"></i> App</a>
    </nav>
  </div>

  <!-- Secciones de contenido -->
  <section class="content-section" id="cartelera">
    <h2 class="section-title">Cartelera Completa</h2>
    <div class="movies-container">
      <div class="carousel-dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="carousel-arrow left"><i class="fas fa-chevron-left"></i></div>
      <div class="carousel-arrow right"><i class="fas fa-chevron-right"></i></div>
      <div class="carousel-content infinite-scroll" id="carouselContent">
        <a href="apocalypto.html" class="movie-card">
          <img src="https://raw.githubusercontent.com/onixmannager/Pruebas/main/apocalypto.jpg" class="movie-poster" alt="Apocalypto">
          <span class="movie-title">Apocalypto</span>
        </a>
        <!-- Resto de tarjetas... -->
      </div>
    </div>
  </section>

  <!-- Resto de secciones... -->

  <script>
    const menuBtn = document.querySelector('.menu-btn');
    const dropdownMenu = document.querySelector('.dropdown-menu');
    
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    document.addEventListener('click', () => dropdownMenu.classList.remove('show'));
    document.addEventListener('keydown', (e) => {if(e.key === 'Escape') dropdownMenu.classList.remove('show')});
    document.addEventListener('touchstart', (e) => {if(!dropdownMenu.contains(e.target) && !menuBtn.contains(e.target)) dropdownMenu.classList.remove('show')});

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });

    document.addEventListener("DOMContentLoaded", function() {
      const video = document.querySelector(".header-video");
      video.oncanplaythrough = () => document.body.style.display = "block";
      
      document.querySelectorAll('.carousel-content.infinite-scroll').forEach(container => {
        let originalContent = container.innerHTML;
        for(let i=0;i<3;i++) container.innerHTML += originalContent;
      });

      if(window.innerWidth >= 769) {
        document.querySelectorAll('.movies-container').forEach(container => {
          const carouselContent = container.querySelector('.carousel-content');
          const arrowLeft = container.querySelector('.carousel-arrow.left');
          const arrowRight = container.querySelector('.carousel-arrow.right');
          const dots = container.querySelectorAll('.carousel-dots .dot');
          const scrollAmount = 300;
          
          if(arrowLeft && arrowRight) {
            arrowLeft.addEventListener('click', () => handleScroll(carouselContent, -scrollAmount));
            arrowRight.addEventListener('click', () => handleScroll(carouselContent, scrollAmount));
          }
          
          if(dots.length) dots.forEach((dot,index) => dot.addEventListener('click', () => handleDotClick(carouselContent, dots, index)));
        });
      }
      
      function handleScroll(element, amount) {
        element.style.animation = 'none';
        element.scrollBy({left: amount, behavior: 'smooth'});
        setTimeout(() => element.style.animation = '', 3000);
      }
      
      function handleDotClick(element, dots, index) {
        element.style.animation = 'none';
        const totalScroll = element.scrollWidth - element.clientWidth;
        element.scrollTo({left: index*(totalScroll/dots.length), behavior:'smooth'});
        dots.forEach(d => d.classList.remove('active'));
        dots[index].classList.add('active');
        setTimeout(() => element.style.animation = '', 3000);
      }
    });
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
