<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Metadatos Open Graph -->
  <meta property="og:title" content="Cinonix - Peliculas y Series Online">
  <meta property="og:description" content="Disfruta del buen contenido">
  <meta property="og:image" content="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  <meta property="og:type" content="website">

  <!-- Iconos -->
  <link rel="icon" href="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/onixmannager/Pruebas/main/logoappcinonix.png">

  <title>Cinonix - Streaming Premium</title>
  
  <!-- Fuentes y estilos externos -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    /* Reset y estilos base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      overflow-x: hidden;
      display: none;
    }

    /* Patrón de fondo */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: -1;
      opacity: 0.3;
    }

    /* Header */
    .header-video {
      max-width: 100%;
      max-height: 500px;
      object-fit: cover;
      margin: 0 auto;
      display: block;
    }

    /* Menú desplegable */
    .menu-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      color: white;
      font-size: 1.2rem;
      backdrop-filter: blur(5px);
    }

    .dropdown-menu {
      position: absolute;
      top: 50px;
      right: 0;
      background: rgba(40, 40, 40, 0.95);
      border-radius: 10px;
      padding: 10px 0;
      min-width: 200px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      display: none;
      opacity: 0;
      transform: translateY(-10px);
    }

    /* Secciones y títulos */
    .content-section {
      margin: 3rem 0;
      padding: 0 1%;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      padding-left: 1%;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Carruseles */
    .movies-container {
      position: relative;
      overflow: hidden;
    }

    .carousel-content {
      display: flex;
      gap: 10px;
      padding: 20px 0;
      scroll-behavior: smooth;
      overflow-x: auto;
    }

    .carousel-content::-webkit-scrollbar {
      display: none;
    }

    /* Tarjetas de películas */
    .movie-card {
      flex: 0 0 160px;
      height: 260px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.4s;
    }

    .movie-card:hover {
      transform: scale(1.05);
      z-index: 2;
    }

    .movie-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Elementos interactivos */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    .carousel-dots {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 5;
    }

    /* Media Queries */
    @media (max-width: 768px) {
      .menu-btn {
        width: 35px;
        height: 35px;
        font-size: 1rem;
      }

      .dropdown-menu {
        top: 45px;
        min-width: 180px;
        padding: 8px 0;
      }

      .movie-card {
        flex: 0 0 120px;
        height: 170px;
      }

      .carousel-arrow,
      .carousel-dots {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .content-section {
        margin-top: 0.5rem;
      }
      
      .section-title {
        font-size: 1.1rem;
        margin-top: 0.5rem !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <video class="header-video" autoplay loop muted playsinline>
      <source src="videoCinoniX.mp4" type="video/mp4">
      Tu navegador no soporta videos.
    </video>
  </header>

  <!-- Menú principal -->
  <div class="menu-container">
    <button class="menu-btn" aria-label="Abrir menú" aria-expanded="false">
      <i class="fas fa-bars"></i>
    </button>
    <nav class="dropdown-menu">
      <!-- Elementos del menú -->
    </nav>
  </div>

  <!-- Secciones de contenido -->
  <main>
    <!-- Carruseles repetidos -->
  </main>

  <script>
    // JavaScript optimizado
    document.addEventListener("DOMContentLoaded", () => {
      const menuToggle = () => {
        const menuBtn = document.querySelector('.menu-btn');
        const dropdownMenu = document.querySelector('.dropdown-menu');
        
        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          dropdownMenu.classList.toggle('show');
          menuBtn.setAttribute('aria-expanded', 
            dropdownMenu.classList.contains('show'));
        });

        document.addEventListener('click', () => {
          dropdownMenu.classList.remove('show');
          menuBtn.setAttribute('aria-expanded', 'false');
        });
      };

      const initCarousels = () => {
        document.querySelectorAll('.carousel-content.infinite-scroll').forEach(container => {
          container.innerHTML = container.innerHTML.repeat(10);
        });
      };

      const videoReady = () => {
        document.querySelector('.header-video').oncanplaythrough = () => {
          document.body.style.display = "block";
        };
      };

      menuToggle();
      initCarousels();
      videoReady();
    });
  </script>
</body>
</html>
